[project]
name = "vlive"
version = "0.1.0"
description = "Text-conditioned Live2D motion3.json generation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "orjson>=3.10",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# 训练依赖，M1 才装，避免 M0 阶段环境臃肿
train = [
    "torch>=2.4",
    "einops>=0.8",
    "transformers>=4.44",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
